<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 팀은 어디로 갈까? - 사다리타기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --night-1: #1b2150;
    --night-2: #2b2f73;
    --night-3: #3b3f8f;
    --gold: #f6c453;
    --gold-soft: #ffe7a3;
    --paper: #fffdf7;
    --ink: #262a56;
    --red: #ff5f6d;
    --yellow: #ffc82e;
    --blue: #4aa8ff;
    --font-title: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    --font-body: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: var(--font-body);
    color: var(--paper);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.10) 0 2px, transparent 3px),
      radial-gradient(circle at 80% 22%, rgba(255,255,255,.12) 0 2px, transparent 3px),
      radial-gradient(circle at 60% 6%, rgba(246,196,83,.35) 0 2px, transparent 3px),
      radial-gradient(circle at 30% 40%, rgba(255,255,255,.08) 0 2px, transparent 3px),
      radial-gradient(circle at 90% 70%, rgba(255,255,255,.10) 0 2px, transparent 3px),
      linear-gradient(170deg, var(--night-1) 0%, var(--night-2) 55%, var(--night-3) 100%);
    background-attachment: fixed;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }

  .app { width: 100%; max-width: 680px; }

  header { text-align: center; margin: 6px 0 18px; }
  h1 {
    font-family: var(--font-title);
    font-weight: 400;
    font-size: clamp(1.9rem, 6.5vw, 2.7rem);
    margin: 0;
    letter-spacing: .02em;
    color: var(--gold-soft);
    text-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  header p { margin: 6px 0 0; font-size: clamp(1rem, 3.6vw, 1.2rem); opacity: .9; }

  .row {
    display: grid;
    grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr));
    gap: 0;
  }
  .row > * { margin: 0 6px; position: relative; z-index: 2; }
  .app.many .row > * { margin: 0 3px; }
  .app.many .team-btn { font-size: clamp(.85rem, 3.2vw, 1.2rem); border-radius: 16px; min-height: 80px; padding: 10px 2px 8px; word-break: keep-all; }
  .app.many .team-btn .dot { width: 26px; height: 26px; }
  .app.many .team-btn.done .dot::after { line-height: 26px; font-size: 16px; }
  .app.many .dest { border-width: 4px; border-radius: 16px; padding: 10px 2px; }
  .app.many .dest .emoji { font-size: clamp(1.6rem, 6.5vw, 2.4rem); }
  .app.many .dest .label { font-size: clamp(.78rem, 3vw, 1.05rem); }

  /* 상단: 팀 버튼 */
  .team-btn {
    --c: var(--red);
    font-family: var(--font-title);
    font-size: clamp(1.15rem, 4.6vw, 1.6rem);
    color: var(--ink);
    background: var(--paper);
    border: 0;
    border-radius: 22px;
    padding: 12px 6px 10px;
    min-height: 92px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 6px 0 var(--c), 0 12px 20px rgba(0,0,0,.28);
    transition: transform .15s ease, box-shadow .15s ease, opacity .2s ease;
  }
  .team-btn .dot {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.15), inset 0 3px 0 rgba(255,255,255,.45);
  }
  .team-btn:hover:not(:disabled) { transform: translateY(-3px); }
  .team-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--c), 0 6px 12px rgba(0,0,0,.28); }
  .team-btn:focus-visible { outline: 4px solid var(--c); outline-offset: 3px; }
  .ctrl:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; }
  .team-btn:disabled { cursor: default; opacity: 1; color: var(--ink); }
  .team-btn.done .dot::after {
    content: "✓"; display: block; text-align: center; line-height: 34px;
    font-family: sans-serif; font-weight: 700; color: #fff; font-size: 20px;
  }
  .team-btn.running { transform: translateY(2px); box-shadow: 0 0 0 5px var(--c), 0 12px 20px rgba(0,0,0,.28); }

  /* 사다리 */
  .ladder-wrap { margin: 6px 0; position: relative; z-index: 1; }
  #ladder { width: 100%; height: auto; display: block; overflow: visible; }

  /* 하단: 도착지 */
  .dest {
    --c: #d5d8f2;
    --glow: rgba(0,0,0,0);
    background: linear-gradient(180deg, #ffffff 0%, #f3f1ff 100%);
    color: var(--ink);
    border: 6px solid #d5d8f2;
    border-radius: 22px;
    padding: 12px 6px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    box-shadow: 0 8px 16px rgba(0,0,0,.25);
    transition: border-color .3s ease, box-shadow .3s ease;
  }
  .dest .emoji { font-size: clamp(2.2rem, 9vw, 3.2rem); line-height: 1.1; }
  .dest .emoji.braille { font-family: 'Segoe UI Symbol', 'Apple Symbols', 'Noto Sans Symbols 2', sans-serif; }
  .dest .label { font-family: var(--font-title); font-size: clamp(.98rem, 3.9vw, 1.3rem); line-height: 1.25; word-break: keep-all; }
  .dest.hit { border-color: var(--c); box-shadow: 0 6px 22px var(--glow); animation: bounce .8s ease; }

  @keyframes bounce {
    0% { transform: translateY(0); } 25% { transform: translateY(-14px) scale(1.04); }
    50% { transform: translateY(0); } 70% { transform: translateY(-6px); } 100% { transform: translateY(0); }
  }


  /* 안내 문구 */
  #message {
    text-align: center;
    font-family: var(--font-title);
    font-size: clamp(1.2rem, 4.8vw, 1.6rem);
    min-height: 2.2em;
    margin: 18px 0 8px;
    color: var(--gold-soft);
  }

  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 4px; }
  .ctrl {
    font-family: var(--font-title);
    font-size: clamp(1rem, 3.8vw, 1.2rem);
    color: var(--gold-soft);
    background: rgba(255,255,255,.10);
    border: 2px solid rgba(255,231,163,.55);
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }
  .ctrl:hover:not(:disabled) { background: rgba(255,255,255,.2); }
  .ctrl:active:not(:disabled) { transform: scale(.96); }
  .ctrl:disabled { opacity: .4; cursor: default; }

  /* 폭죽 */
  #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .piece {
    position: absolute; top: -30px;
    font-size: 26px;
    animation: fall var(--dur) ease-in forwards;
  }
  @keyframes fall {
    to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: .9; }
  }

  /* 관리자 */
  .admin-link {
    display: block; margin: 22px auto 0; padding: 6px 12px;
    font-family: var(--font-body); font-size: .9rem;
    color: rgba(255,253,247,.55); background: none; border: 0; cursor: pointer;
  }
  .admin-link:hover { color: var(--gold-soft); }
  .admin-link:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }

  .modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: flex-start; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 16px 16px;
    background: rgba(10,12,40,.6);
    overflow-y: auto;
  }
  .modal[hidden] { display: none; }
  .panel {
    width: 100%; max-width: 560px; margin: 4vh 0;
    background: var(--paper); color: var(--ink);
    border-radius: 20px; padding: 20px 18px;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  .panel h2 { font-family: var(--font-title); font-weight: 400; font-size: 1.5rem; margin: 0 0 14px; }
  .panel h3 { font-family: var(--font-title); font-weight: 400; font-size: 1.15rem; margin: 18px 0 8px; }
  .panel label { display: block; font-size: .95rem; margin: 10px 0 4px; }
  .panel input[type=text], .panel input[type=password], .panel select {
    width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
    padding: 9px 10px; border: 2px solid #d5d8f2; border-radius: 10px; background: #fff;
  }
  .panel input:focus, .panel select:focus { outline: none; border-color: var(--night-3); }
  .panel .err { color: #d6334a; font-size: .95rem; min-height: 1.3em; margin: 8px 0 0; }
  .panel .hint { font-size: .85rem; opacity: .7; margin: 4px 0 0; }
  .cfg-row { display: grid; gap: 6px; align-items: center; margin-bottom: 8px; }
  .cfg-row.cfg-team { grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr); }
  .cfg-row.cfg-dest { grid-template-columns: 64px minmax(0, 1fr); }
  .cfg-row input[type=color] { width: 44px; height: 40px; padding: 2px; border: 2px solid #d5d8f2; border-radius: 10px; background: #fff; }
  .cfg-row .emoji-in { text-align: center; }
  .panel-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .pbtn {
    font-family: var(--font-title); font-size: 1rem;
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--night-3); background: #fff; color: var(--night-3);
  }
  .pbtn.primary { background: var(--night-3); color: #fff; }
  .pbtn.left { margin-right: auto; }
  .pbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .dest.hit { animation: none; }
    .piece { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1 id="title">우리 팀은 어디로 갈까?</h1>
    <p id="subtitle">우리 팀 이름을 눌러 보세요!</p>
  </header>

  <div class="row" id="top"></div>

  <div class="ladder-wrap">
    <svg id="ladder" viewBox="0 0 600 460" role="img" aria-label="사다리타기 그림"></svg>
  </div>

  <div class="row" id="bottom"></div>

  <div id="message" aria-live="polite">팀을 골라 눌러 보세요 👆</div>

  <div class="controls">
    <button class="ctrl" id="btn-reset">처음부터 다시</button>
  </div>

  <button class="admin-link" id="btn-admin" type="button">⚙ 관리자</button>
</div>

<!-- 관리자 로그인 -->
<div class="modal" id="login-modal" hidden role="dialog" aria-modal="true" aria-labelledby="login-title">
  <form class="panel" id="login-form" autocomplete="off">
    <h2 id="login-title">관리자 로그인</h2>
    <label for="login-id">아이디</label>
    <input type="text" id="login-id" autocapitalize="off" spellcheck="false">
    <label for="login-pw">비밀번호</label>
    <input type="password" id="login-pw">
    <p class="err" id="login-err" aria-live="polite"></p>
    <div class="panel-actions">
      <button type="button" class="pbtn" data-close>취소</button>
      <button type="submit" class="pbtn primary">로그인</button>
    </div>
  </form>
</div>

<!-- 관리자 설정 -->
<div class="modal" id="admin-modal" hidden role="dialog" aria-modal="true" aria-labelledby="admin-title">
  <form class="panel" id="admin-form" autocomplete="off">
    <h2 id="admin-title">사다리 설정</h2>

    <h3>제목 글자</h3>
    <label for="cfg-title">큰 제목</label>
    <input type="text" id="cfg-title">
    <label for="cfg-subtitle">작은 안내 글</label>
    <input type="text" id="cfg-subtitle">

    <h3>인원(팀)과 도착지 수</h3>
    <label for="cfg-count">팀 수 = 도착지 수</label>
    <select id="cfg-count"></select>
    <p class="hint">사다리는 위·아래 칸 수가 같아야 해서, 팀 수와 도착지 수가 함께 바뀌어요.</p>

    <h3>위쪽: 팀 (색 · 이름 · 도착할 곳)</h3>
    <div id="cfg-teams"></div>

    <h3>아래쪽: 도착지 (그림 · 이름)</h3>
    <div id="cfg-dests"></div>

    <p class="err" id="admin-err" aria-live="polite"></p>
    <div class="panel-actions">
      <button type="button" class="pbtn left" id="cfg-default">기본값으로</button>
      <button type="button" class="pbtn" id="cfg-logout">로그아웃</button>
      <button type="button" class="pbtn" data-close>닫기</button>
      <button type="submit" class="pbtn primary">저장</button>
    </div>
  </form>
</div>

<div id="confetti" aria-hidden="true"></div>

<script>
(function () {
  'use strict';

  /* ============ 기본 설정 (관리자 화면에서 바꿀 수 있어요) ============ */
  var ADMIN_ID = 'admin';
  var ADMIN_PW = '1234';
  var MIN_N = 2, MAX_N = 6;

  var DEFAULT_CONFIG = {
    title: '우리 팀은 어디로 갈까?',
    subtitle: '우리 팀 이름을 눌러 보세요!',
    teams: [
      { name: '빨강팀', color: '#ff5f6d', dest: 1 },   // → 점자 만들기
      { name: '노랑팀', color: '#ffc82e', dest: 0 },   // → 유도 블록 만들기
      { name: '파랑팀', color: '#4aa8ff', dest: 2 }    // → 음성 인식 버튼(녹음)
    ],
    dests: [
      { name: '유도 블록 만들기', emoji: '🟨' },
      { name: '점자 만들기',      emoji: '⠿'  },
      { name: '음성 인식 버튼',   emoji: '🔊' }
    ]
  };
  // 팀·도착지를 늘릴 때 새로 생기는 칸의 기본값
  var EXTRA_TEAMS = [
    { name: '초록팀', color: '#3ccf8e' },
    { name: '보라팀', color: '#a77bff' },
    { name: '주황팀', color: '#ff9a3c' },
    { name: '분홍팀', color: '#ff7eb6' },
    { name: '하늘팀', color: '#5fd3f3' },
    { name: '갈색팀', color: '#b5835a' }
  ];
  var EXTRA_EMOJIS = ['⭐', '🎨', '📚', '🎵', '🧩', '🌱'];
  var STORE_KEY = 'ladder-config-v1';
  /* ===================================================================== */

  var W = 600;
  var EXT = 36;                    // 사다리를 위·아래 박스 뒤로 연장하는 길이
  var ROW = 34;                    // 가로줄 사이 간격
  var NS = 'http://www.w3.org/2000/svg';

  var appEl = document.getElementById('app');
  var svg = document.getElementById('ladder');
  var topEl = document.getElementById('top');
  var bottomEl = document.getElementById('bottom');
  var msgEl = document.getElementById('message');
  var btnReset = document.getElementById('btn-reset');
  var confettiEl = document.getElementById('confetti');

  var config, N, XS, H;
  var rungs = [];
  var done = [];
  var busy = false;

  /* ---------- 설정 저장/불러오기 ---------- */
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function isValid(c) {
    if (!c || typeof c.title !== 'string' || typeof c.subtitle !== 'string') return false;
    if (!Array.isArray(c.teams) || !Array.isArray(c.dests)) return false;
    var n = c.teams.length;
    if (n < MIN_N || n > MAX_N || c.dests.length !== n) return false;
    var seen = {};
    return c.teams.every(function (t) {
      var ok = typeof t.name === 'string' && /^#[0-9a-f]{6}$/i.test(t.color) &&
        t.dest === (t.dest | 0) && t.dest >= 0 && t.dest < n && !seen[t.dest];
      seen[t.dest] = true;
      return ok;
    }) && c.dests.every(function (d) { return typeof d.name === 'string' && typeof d.emoji === 'string'; });
  }

  function loadConfig() {
    try {
      var c = JSON.parse(localStorage.getItem(STORE_KEY));
      if (isValid(c)) return c;
    } catch (e) {}
    return clone(DEFAULT_CONFIG);
  }
  function saveConfig(c) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(c)); return true; } catch (e) { return false; }
  }
  function clearConfig() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  }

  function applyConfig(c) {
    config = c;
    N = c.teams.length;
    XS = [];
    for (var i = 0; i < N; i++) XS.push(W * (i + 0.5) / N);   // 칸 가운데와 맞춤
    appEl.style.setProperty('--n', N);
    appEl.classList.toggle('many', N >= 5);
    document.getElementById('title').textContent = c.title;
    document.getElementById('subtitle').textContent = c.subtitle;
    document.title = c.title + ' - 사다리타기';
  }

  /* ---------- 화면 구성 ---------- */
  function buildTop() {
    topEl.innerHTML = '';
    config.teams.forEach(function (t, i) {
      var b = document.createElement('button');
      b.className = 'team-btn';
      b.style.setProperty('--c', t.color);
      var dot = document.createElement('span'); dot.className = 'dot';
      var name = document.createElement('span'); name.textContent = t.name;
      b.appendChild(dot); b.appendChild(name);
      b.addEventListener('click', function () { playOne(i); });
      topEl.appendChild(b);
    });
  }
  function isBraille(s) { return /[⠀-⣿]/.test(s); }
  function buildBottom() {
    bottomEl.innerHTML = '';
    config.dests.forEach(function (d) {
      var el = document.createElement('div');
      el.className = 'dest';
      var em = document.createElement('div');
      em.className = 'emoji' + (isBraille(d.emoji) ? ' braille' : '');
      em.textContent = d.emoji;
      var label = document.createElement('div');
      label.className = 'label';
      label.textContent = d.name;
      el.appendChild(em); el.appendChild(label);
      bottomEl.appendChild(el);
    });
  }

  /* ---------- 사다리 만들기 ---------- */
  // 가로줄 순서(seq: 왼쪽 칸 번호 목록)를 따라갔을 때 각 팀이 도착하는 칸
  function endsOf(seq) {
    var at = [];                       // at[칸] = 지금 그 칸에 있는 팀
    for (var i = 0; i < N; i++) at.push(i);
    seq.forEach(function (a) { var t = at[a]; at[a] = at[a + 1]; at[a + 1] = t; });
    var end = [];
    at.forEach(function (team, lane) { end[team] = lane; });
    return end;
  }
  function randInt(n) { return Math.floor(Math.random() * n); }

  // 무작위 가로줄 뒤에, 도착지를 맞추는 가로줄을 이어 붙인 순서를 만들어요.
  function makeSequence() {
    var seq = [];
    var count = N + 3 + randInt(N + 2);
    while (seq.length < count) {
      var a = randInt(N - 1);
      if (N > 2 && a === seq[seq.length - 1]) continue;   // 같은 자리 연속은 피하기
      seq.push(a);
    }
    // 지금 도착하는 칸을 목표 칸으로 정렬(이웃끼리 교환)하는 가로줄 추가
    var end = endsOf(seq);
    var at = [];
    end.forEach(function (lane, team) { at[lane] = team; });
    var want = config.teams.map(function (t) { return t.dest; });
    var fixes = [];
    for (var pass = 0; pass < N; pass++) {
      for (var a2 = 0; a2 < N - 1; a2++) {
        if (want[at[a2]] > want[at[a2 + 1]]) {
          var t = at[a2]; at[a2] = at[a2 + 1]; at[a2 + 1] = t;
          fixes.push(a2);
        }
      }
    }
    // 교환 가로줄들을 무작위 줄 사이사이에 섞으면 순서가 바뀌므로, 뒤에 이어 붙이고
    // 아래에서 줄(row) 배치를 할 때 겹치지 않는 가로줄끼리 같은 높이에 놓아 자연스럽게 보이게 해요.
    return seq.concat(fixes);
  }

  // 가로줄을 높이(row)에 배치: 겹치는 칸을 쓰는 이전 가로줄보다 항상 아래에 둬서 결과가 그대로 유지돼요.
  function layout(seq) {
    var last = [];                    // last[칸] = 그 칸을 마지막으로 쓴 row
    for (var i = 0; i < N; i++) last.push(-1);
    var placed = seq.map(function (a) {
      var row = Math.max(last[a], last[a + 1]) + 1;
      // 바로 옆 가로줄과 같은 높이면 헷갈리니 한 칸 내리기
      if (a > 0 && last[a - 1] === row) row++;
      if (a + 2 < N && last[a + 2] === row) row++;
      last[a] = last[a + 1] = row;
      return { a: a, row: row };
    });
    var rows = Math.max.apply(null, last) + 1;
    H = Math.max(360, 60 + rows * ROW);
    var step = (H - 60) / rows;
    return placed.map(function (r) {
      var jitter = (Math.random() - 0.5) * step * 0.4;
      return { a: r.a, y: 30 + step * (r.row + 0.5) + jitter };
    });
  }

  function makeRungs() {
    var want = config.teams.map(function (t) { return t.dest; });
    var best = null;
    for (var tries = 0; tries < 200; tries++) {
      var seq = makeSequence();
      var end = endsOf(seq);
      var ok = want.every(function (d, i) { return end[i] === d; });
      if (!ok) continue;
      rungs = layout(seq);
      var allMove = [];
      for (var i = 0; i < N; i++) allMove.push(pathFor(i).pts.length > 2);
      best = rungs;
      if (allMove.every(Boolean)) break;
    }
    rungs = best;
  }

  function el(name, attrs) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  function drawLadder() {
    svg.innerHTML = '';
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    var sw = N >= 5 ? 9 : 12;
    var base = el('g', { id: 'base' });
    // 세로줄
    XS.forEach(function (x) {
      base.appendChild(el('line', { x1: x, y1: -EXT, x2: x, y2: H + EXT, stroke: '#a9b0f0', 'stroke-width': sw, 'stroke-linecap': 'round', opacity: 0.95 }));
    });
    // 가로줄
    rungs.forEach(function (r) {
      base.appendChild(el('line', { x1: XS[r.a], y1: r.y, x2: XS[r.a + 1], y2: r.y, stroke: '#a9b0f0', 'stroke-width': sw, 'stroke-linecap': 'round', opacity: 0.95 }));
    });
    svg.appendChild(base);
    svg.appendChild(el('g', { id: 'traces' }));
  }

  /* ---------- 길 계산 ---------- */
  function pathFor(start) {
    var pts = [[XS[start], -EXT]];
    var cur = start;
    var sorted = rungs.slice().sort(function (p, q) { return p.y - q.y; });
    sorted.forEach(function (r) {
      var next = null;
      if (r.a === cur) next = cur + 1;
      else if (r.a + 1 === cur) next = cur - 1;
      if (next !== null) {
        pts.push([XS[cur], r.y]);
        pts.push([XS[next], r.y]);
        cur = next;
      }
    });
    pts.push([XS[cur], H + EXT]);
    return { pts: pts, end: cur };
  }

  /* ---------- 애니메이션 ---------- */
  function animate(teamIdx) {
    return new Promise(function (resolve) {
      var team = config.teams[teamIdx];
      var p = pathFor(teamIdx);
      var pts = p.pts;
      var segs = [], total = 0;
      for (var i = 1; i < pts.length; i++) {
        var len = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
        segs.push(len); total += len;
      }
      var sw = N >= 5 ? 9 : 12;
      var traces = svg.querySelector('#traces');
      var line = el('polyline', { fill: 'none', stroke: team.color, 'stroke-width': sw, 'stroke-linecap': 'butt', 'stroke-linejoin': 'miter' });
      var token = el('g', {});
      var r = N >= 5 ? 15 : 20;
      token.appendChild(el('circle', { r: r, fill: team.color, stroke: '#fff', 'stroke-width': 5 }));
      token.appendChild(el('circle', { r: r * 0.3, cx: -r * 0.3, cy: -r * 0.3, fill: '#fff', opacity: 0.6 }));
      traces.appendChild(line); traces.appendChild(token);

      var speed = 560;   // 1초에 움직이는 거리 (숫자를 키우면 빨라져요)
      var t0 = null;
      function frame(ts) {
        if (t0 === null) t0 = ts;
        var dist = Math.min(total, (ts - t0) / 1000 * speed);
        var acc = 0, drawn = [pts[0].join(',')], head = pts[0];
        for (var s = 0; s < segs.length; s++) {
          if (acc + segs[s] <= dist) {
            acc += segs[s];
            drawn.push(pts[s + 1].join(','));
            head = pts[s + 1];
          } else {
            var f = (dist - acc) / segs[s];
            var x = pts[s][0] + (pts[s + 1][0] - pts[s][0]) * f;
            var y = pts[s][1] + (pts[s + 1][1] - pts[s][1]) * f;
            drawn.push(x + ',' + y);
            head = [x, y];
            break;
          }
        }
        line.setAttribute('points', drawn.join(' '));
        token.setAttribute('transform', 'translate(' + head[0] + ',' + head[1] + ')');
        if (dist < total) requestAnimationFrame(frame);
        else {
          token.parentNode.removeChild(token);
          resolve(p.end);
        }
      }
      requestAnimationFrame(frame);
    });
  }

  /* ---------- 결과 표시 ---------- */
  function celebrate() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var icons = ['⭐', '🎉', '✨', '🌟', '🎈'];
    for (var i = 0; i < 26; i++) {
      var s = document.createElement('span');
      s.className = 'piece';
      s.textContent = icons[Math.floor(Math.random() * icons.length)];
      s.style.left = (Math.random() * 100) + 'vw';
      s.style.setProperty('--dur', (1.6 + Math.random() * 1.4) + 's');
      s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      s.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      s.style.fontSize = (18 + Math.random() * 20) + 'px';
      confettiEl.appendChild(s);
      (function (n) { setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 3200); })(s);
    }
  }

  function hexToRgba(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  // 이름 끝 글자에 받침이 있으면 '은', 없으면 '는'
  function topicParticle(word) {
    var c = word.charCodeAt(word.length - 1);
    if (c >= 0xac00 && c <= 0xd7a3) return (c - 0xac00) % 28 ? '은' : '는';
    return '은(는)';
  }

  function showResult(teamIdx, destIdx) {
    var team = config.teams[teamIdx];
    var dest = config.dests[destIdx];
    var card = bottomEl.children[destIdx];
    card.style.setProperty('--c', team.color);
    card.style.setProperty('--glow', hexToRgba(team.color, 0.4));
    card.classList.remove('hit'); void card.offsetWidth; card.classList.add('hit');
    msgEl.textContent = '🎉 ' + team.name + topicParticle(team.name) + ' ' + dest.name + '!';
    celebrate();
  }

  /* ---------- 버튼 동작 ---------- */
  function setButtons() {
    Array.prototype.forEach.call(topEl.children, function (b, i) {
      b.disabled = busy || done[i];
      b.classList.toggle('done', done[i]);
    });
    btnReset.disabled = busy;
    btnAdmin.disabled = busy;
  }

  function playOne(i) {
    if (busy || done[i]) return Promise.resolve();
    busy = true; setButtons();
    topEl.children[i].classList.add('running');
    msgEl.textContent = config.teams[i].name + ' 출발! 🚀';
    return animate(i).then(function (end) {
      done[i] = true; busy = false;
      topEl.children[i].classList.remove('running');
      setButtons();
      showResult(i, end);
    });
  }

  function reset() {
    if (busy) return;
    done = config.teams.map(function () { return false; });
    makeRungs();
    drawLadder();
    buildBottom();
    msgEl.textContent = '팀을 골라 눌러 보세요 👆';
    setButtons();
  }

  function rebuildAll(c) {
    applyConfig(c);
    buildTop();
    reset();
  }

  btnReset.addEventListener('click', reset);

  /* ---------- 관리자 ---------- */
  // 주의: 이 페이지는 서버 없이 동작해서 아이디/비밀번호가 코드에 그대로 보여요.
  // 아이들이 실수로 설정을 바꾸지 않게 막는 정도의 잠금이에요.
  var btnAdmin = document.getElementById('btn-admin');
  var loginModal = document.getElementById('login-modal');
  var adminModal = document.getElementById('admin-modal');
  var loginForm = document.getElementById('login-form');
  var adminForm = document.getElementById('admin-form');
  var loginErr = document.getElementById('login-err');
  var adminErr = document.getElementById('admin-err');
  var cfgTitle = document.getElementById('cfg-title');
  var cfgSubtitle = document.getElementById('cfg-subtitle');
  var cfgCount = document.getElementById('cfg-count');
  var cfgTeams = document.getElementById('cfg-teams');
  var cfgDests = document.getElementById('cfg-dests');
  var LOGIN_KEY = 'ladder-admin';
  var loggedIn = false;      // 로그인은 브라우저 탭을 닫을 때까지 유지돼요
  try { loggedIn = sessionStorage.getItem(LOGIN_KEY) === '1'; } catch (e) {}
  function setLoggedIn(v) {
    loggedIn = v;
    try { if (v) sessionStorage.setItem(LOGIN_KEY, '1'); else sessionStorage.removeItem(LOGIN_KEY); } catch (e) {}
  }
  var draft = null;          // 관리자 화면에서 고치는 중인 설정
  var lastFocus = null;

  function openModal(m, focusEl) {
    lastFocus = document.activeElement;
    m.hidden = false;
    (focusEl || m.querySelector('input,select,button')).focus();
  }
  function closeModal(m) {
    m.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  [loginModal, adminModal].forEach(function (m) {
    m.addEventListener('click', function (e) {
      if (e.target === m || e.target.hasAttribute('data-close')) closeModal(m);
    });
    m.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(m); });
  });

  btnAdmin.addEventListener('click', function () {
    if (busy) return;
    if (loggedIn) return openAdmin();
    loginForm.reset();
    loginErr.textContent = '';
    openModal(loginModal, document.getElementById('login-id'));
  });

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = document.getElementById('login-id').value.trim();
    var pw = document.getElementById('login-pw').value;
    if (id === ADMIN_ID && pw === ADMIN_PW) {
      setLoggedIn(true);
      loginModal.hidden = true;
      openAdmin();
    } else {
      loginErr.textContent = '아이디 또는 비밀번호가 맞지 않아요.';
      document.getElementById('login-pw').value = '';
      document.getElementById('login-pw').focus();
    }
  });

  for (var n = MIN_N; n <= MAX_N; n++) {
    var opt = document.createElement('option');
    opt.value = n; opt.textContent = n + '개';
    cfgCount.appendChild(opt);
  }

  function openAdmin() {
    draft = clone(config);
    adminErr.textContent = '';
    renderAdmin();
    openModal(adminModal, cfgTitle);
  }

  // 입력칸의 값을 draft에 모아요.
  function readAdmin() {
    draft.title = cfgTitle.value;
    draft.subtitle = cfgSubtitle.value;
    Array.prototype.forEach.call(cfgTeams.children, function (row, i) {
      draft.teams[i].color = row.querySelector('input[type=color]').value;
      draft.teams[i].name = row.querySelector('input[type=text]').value;
      draft.teams[i].dest = parseInt(row.querySelector('select').value, 10);
    });
    Array.prototype.forEach.call(cfgDests.children, function (row, i) {
      draft.dests[i].emoji = row.querySelector('.emoji-in').value;
      draft.dests[i].name = row.querySelector('.name-in').value;
    });
  }

  function destLabel(i) {
    return (i + 1) + '번 ' + (draft.dests[i].name || '(이름 없음)');
  }

  function renderAdmin() {
    cfgTitle.value = draft.title;
    cfgSubtitle.value = draft.subtitle;
    cfgCount.value = draft.teams.length;

    cfgTeams.innerHTML = '';
    draft.teams.forEach(function (t, i) {
      var row = document.createElement('div');
      row.className = 'cfg-row cfg-team';
      var color = document.createElement('input');
      color.type = 'color'; color.value = t.color;
      color.setAttribute('aria-label', (i + 1) + '번 팀 색');
      var name = document.createElement('input');
      name.type = 'text'; name.value = t.name; name.maxLength = 20;
      name.setAttribute('aria-label', (i + 1) + '번 팀 이름');
      var sel = document.createElement('select');
      sel.setAttribute('aria-label', (i + 1) + '번 팀이 도착할 곳');
      draft.dests.forEach(function (d, j) {
        var o = document.createElement('option');
        o.value = j; o.textContent = '→ ' + destLabel(j);
        sel.appendChild(o);
      });
      sel.value = t.dest;
      row.appendChild(color); row.appendChild(name); row.appendChild(sel);
      cfgTeams.appendChild(row);
    });

    cfgDests.innerHTML = '';
    draft.dests.forEach(function (d, i) {
      var row = document.createElement('div');
      row.className = 'cfg-row cfg-dest';
      var emoji = document.createElement('input');
      emoji.type = 'text'; emoji.className = 'emoji-in'; emoji.value = d.emoji; emoji.maxLength = 8;
      emoji.setAttribute('aria-label', (i + 1) + '번 도착지 그림(이모지)');
      var name = document.createElement('input');
      name.type = 'text'; name.className = 'name-in'; name.value = d.name; name.maxLength = 30;
      name.setAttribute('aria-label', (i + 1) + '번 도착지 이름');
      name.addEventListener('input', function () {
        // 팀 목록의 도착지 이름도 바로 바꿔 보여 주기
        draft.dests[i].name = name.value;
        Array.prototype.forEach.call(cfgTeams.querySelectorAll('select'), function (s) {
          s.options[i].textContent = '→ ' + destLabel(i);
        });
      });
      row.appendChild(emoji); row.appendChild(name);
      cfgDests.appendChild(row);
    });
  }

  cfgCount.addEventListener('change', function () {
    readAdmin();
    var n = parseInt(cfgCount.value, 10);
    while (draft.teams.length < n) {
      var k = draft.teams.length;
      var extra = EXTRA_TEAMS[(k - 3 + EXTRA_TEAMS.length) % EXTRA_TEAMS.length];
      draft.teams.push({ name: extra.name, color: extra.color, dest: -1 });
      draft.dests.push({ name: '도착지 ' + (k + 1), emoji: EXTRA_EMOJIS[k % EXTRA_EMOJIS.length] });
    }
    draft.teams.length = n;
    draft.dests.length = n;
    // 겹치거나 없어진 도착지는 남은 번호로 다시 채우기
    var used = {};
    draft.teams.forEach(function (t) {
      if (t.dest >= 0 && t.dest < n && !used[t.dest]) used[t.dest] = true;
      else t.dest = -1;
    });
    draft.teams.forEach(function (t) {
      if (t.dest !== -1) return;
      for (var j = 0; j < n; j++) if (!used[j]) { t.dest = j; used[j] = true; break; }
    });
    adminErr.textContent = '';
    renderAdmin();
  });

  adminForm.addEventListener('submit', function (e) {
    e.preventDefault();
    readAdmin();
    draft.title = draft.title.trim();
    draft.subtitle = draft.subtitle.trim();
    draft.teams.forEach(function (t) { t.name = t.name.trim(); });
    draft.dests.forEach(function (d) { d.name = d.name.trim(); d.emoji = d.emoji.trim(); });

    if (!draft.title) return showErr('큰 제목을 입력해 주세요.');
    if (draft.teams.some(function (t) { return !t.name; })) return showErr('팀 이름을 모두 입력해 주세요.');
    if (draft.dests.some(function (d) { return !d.name; })) return showErr('도착지 이름을 모두 입력해 주세요.');
    var used = {}, dup = null;
    draft.teams.forEach(function (t) { if (used[t.dest]) dup = t.dest; used[t.dest] = true; });
    if (dup !== null) return showErr('두 팀이 같은 도착지(' + destLabel(dup) + ')로 가요. 팀마다 다른 도착지를 골라 주세요.');

    var saved = saveConfig(draft);
    rebuildAll(clone(draft));
    closeModal(adminModal);
    msgEl.textContent = saved ? '설정을 저장했어요 ✅' : '설정을 바꿨어요 (이 브라우저에 저장은 안 됐어요)';
  });

  function showErr(t) { adminErr.textContent = t; }
  adminForm.addEventListener('change', function (e) {
    if (e.target !== cfgCount) adminErr.textContent = '';
  });

  document.getElementById('cfg-default').addEventListener('click', function () {
    draft = clone(DEFAULT_CONFIG);
    adminErr.textContent = '기본값을 불러왔어요. [저장]을 눌러야 적용돼요.';
    renderAdmin();
  });

  document.getElementById('cfg-logout').addEventListener('click', function () {
    setLoggedIn(false);
    closeModal(adminModal);
    msgEl.textContent = '로그아웃했어요.';
  });

  /* ---------- 시작 ---------- */
  rebuildAll(loadConfig());
})();
</script>
</body>
</html>
